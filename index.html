<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="マークダウン形式のテキストをリアルタイムでプレビューできる無料のオンラインエディタ">
    <meta name="keywords" content="markdown, editor, converter, プレビュー, エディタ">
    <meta name="author" content="Markdown Converter App">
    <meta name="theme-color" content="#667eea">
    <title>マークダウン変換アプリ - リアルタイムプレビュー &amp; エディタ</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <div class="header-left">
                    <h1>マークダウン変換アプリ</h1>
                    <p>テキストを入力すると、マークダウン形式でプレビュー表示されます</p>
                </div>
                <div class="header-controls">
                    <button id="theme-toggle" class="icon-button" title="ダークモード切り替え">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="sun-icon">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="moon-icon" style="display: none;">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </header>

        <div class="toolbar" role="toolbar" aria-label="ドキュメント操作">
            <div class="toolbar-section">
                <button id="new-btn" class="toolbar-button" title="新規作成" aria-label="新規ドキュメントを作成">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                    </svg>
                    新規
                </button>
                <button id="open-btn" class="toolbar-button" title="ファイルを開く" aria-label="マークダウンファイルを開く">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
                        <polyline points="13 2 13 9 20 9"></polyline>
                    </svg>
                    開く
                </button>
                <button id="save-btn" class="toolbar-button" title="保存 (Ctrl+S)" aria-label="ファイルとして保存">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                        <polyline points="17 21 17 13 7 13 7 21"></polyline>
                        <polyline points="7 3 7 8 15 8"></polyline>
                    </svg>
                    保存
                </button>
            </div>
            <div class="toolbar-section">
                <span id="last-saved" class="last-saved-text" aria-live="polite"></span>
            </div>
        </div>

        <!-- モバイル用タブ切り替え -->
        <div class="mobile-tabs" role="tablist" aria-label="表示モード切り替え">
            <button id="tab-edit" class="active" role="tab" aria-selected="true" aria-controls="input-section" aria-label="編集モード">
                ✏️ 編集
            </button>
            <button id="tab-preview" role="tab" aria-selected="false" aria-controls="output-section" aria-label="プレビューモード">
                👁️ プレビュー
            </button>
        </div>

        <div class="main-content" role="main">
            <div id="input-section" class="input-section" role="tabpanel" aria-labelledby="tab-edit">
                <div class="section-header">
                    <h2>入力</h2>
                    <div class="stats" role="status" aria-label="文書統計">
                        <span class="stat-item">
                            <strong>文字数:</strong> <span id="char-count" aria-label="文字数">0</span>
                        </span>
                        <span class="stat-item">
                            <strong>単語数:</strong> <span id="word-count" aria-label="単語数">0</span>
                        </span>
                        <span class="stat-item">
                            <strong>行数:</strong> <span id="line-count" aria-label="行数">0</span>
                        </span>
                    </div>
                </div>
                <textarea id="input-text" aria-label="マークダウンテキスト入力エリア" placeholder="ここにテキストを入力してください...

例:
# 見出し1
## 見出し2
### 見出し3

**太字**
*斜体*

- リスト項目1
- リスト項目2

1. 番号付きリスト1
2. 番号付きリスト2

[リンク](https://example.com)

`コード`

```
コードブロック
```
"></textarea>
            </div>

            <div id="output-section" class="output-section" role="tabpanel" aria-labelledby="tab-preview">
                <div class="section-header">
                    <h2>プレビュー</h2>
                    <button id="copy-btn" class="copy-button" title="HTMLをコピー" aria-label="変換されたHTMLをクリップボードにコピー">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                        コピー
                    </button>
                </div>
                <div id="output-preview" class="preview-content" role="region" aria-label="マークダウンプレビュー" aria-live="polite">
                    <p class="placeholder">ここにマークダウンのプレビューが表示されます</p>
                </div>
            </div>
        </div>

        <div class="info-section">
            <h3>使い方</h3>
            <ul>
                <li>左側のテキストエリアにマークダウン記法でテキストを入力してください</li>
                <li>右側にリアルタイムでプレビューが表示されます</li>
                <li>「コピー」ボタンをクリックすると、変換されたHTMLをクリップボードにコピーできます</li>
            </ul>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
