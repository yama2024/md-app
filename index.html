<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="マークダウン形式のテキストをリアルタイムでプレビューできる無料のオンラインエディタ">
    <meta name="keywords" content="markdown, editor, converter, プレビュー, エディタ">
    <meta name="author" content="Markdown Converter App">
    <meta name="theme-color" content="#667eea">
    <title>マークダウン変換アプリ - リアルタイムプレビュー &amp; エディタ</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <div class="header-left">
                    <h1>マークダウン変換アプリ</h1>
                    <p>テキストを入力すると、マークダウン形式でプレビュー表示されます</p>
                </div>
                <div class="header-controls">
                    <button id="theme-toggle" class="icon-button" title="ダークモード切り替え">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="sun-icon">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="moon-icon" style="display: none;">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </header>

        <div class="toolbar" role="toolbar" aria-label="ドキュメント操作">
            <div class="toolbar-section">
                <button id="new-btn" class="toolbar-button" title="新規作成" aria-label="新規ドキュメントを作成">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                    </svg>
                    新規
                </button>
                <button id="open-btn" class="toolbar-button" title="ファイルを開く" aria-label="マークダウンファイルを開く">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
                        <polyline points="13 2 13 9 20 9"></polyline>
                    </svg>
                    開く
                </button>
                <button id="save-btn" class="toolbar-button" title="保存 (Ctrl+S)" aria-label="ファイルとして保存">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                        <polyline points="17 21 17 13 7 13 7 21"></polyline>
                        <polyline points="7 3 7 8 15 8"></polyline>
                    </svg>
                    保存
                </button>
            </div>
            <div class="toolbar-section">
                <span id="last-saved" class="last-saved-text" aria-live="polite"></span>
            </div>
        </div>

        <!-- モバイル用タブ切り替え -->
        <div class="mobile-tabs" role="tablist" aria-label="表示モード切り替え">
            <button id="tab-edit" class="active" role="tab" aria-selected="true" aria-controls="input-section" aria-label="編集モード">
                ✏️ 編集
            </button>
            <button id="tab-preview" role="tab" aria-selected="false" aria-controls="output-section" aria-label="プレビューモード">
                👁️ プレビュー
            </button>
        </div>

        <div class="main-content" role="main">
            <div id="input-section" class="input-section" role="tabpanel" aria-labelledby="tab-edit">
                <div class="section-header">
                    <h2>入力</h2>
                    <div class="stats" role="status" aria-label="文書統計">
                        <span class="stat-item">
                            <strong>文字数:</strong> <span id="char-count" aria-label="文字数">0</span>
                        </span>
                        <span class="stat-item">
                            <strong>単語数:</strong> <span id="word-count" aria-label="単語数">0</span>
                        </span>
                        <span class="stat-item">
                            <strong>行数:</strong> <span id="line-count" aria-label="行数">0</span>
                        </span>
                    </div>
                </div>

                <!-- Markdownツールバー -->
                <div class="markdown-toolbar" role="toolbar" aria-label="Markdown書式設定">
                    <button class="md-tool-btn" data-action="bold" title="太字 (Ctrl+B)" aria-label="太字">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path>
                            <path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path>
                        </svg>
                    </button>
                    <button class="md-tool-btn" data-action="italic" title="イタリック (Ctrl+I)" aria-label="イタリック">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <line x1="19" y1="4" x2="10" y2="4"></line>
                            <line x1="14" y1="20" x2="5" y2="20"></line>
                            <line x1="15" y1="4" x2="9" y2="20"></line>
                        </svg>
                    </button>
                    <button class="md-tool-btn" data-action="strikethrough" title="打ち消し線" aria-label="打ち消し線">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <path d="M17.3 5.3c-1.2-1-2.7-1.3-4.3-1.3-2.7 0-4.7 1.2-4.7 3.5 0 1.5 1 2.5 2.5 3"></path>
                            <path d="M14 12c2.3.6 4 1.7 4 3.5 0 2.6-2.4 4.5-5.5 4.5-2.5 0-4.6-1.2-5.5-3"></path>
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                        </svg>
                    </button>

                    <div class="md-toolbar-divider"></div>

                    <button class="md-tool-btn" data-action="heading1" title="見出し1" aria-label="見出し1">
                        <span class="md-tool-text">H1</span>
                    </button>
                    <button class="md-tool-btn" data-action="heading2" title="見出し2" aria-label="見出し2">
                        <span class="md-tool-text">H2</span>
                    </button>
                    <button class="md-tool-btn" data-action="heading3" title="見出し3" aria-label="見出し3">
                        <span class="md-tool-text">H3</span>
                    </button>

                    <div class="md-toolbar-divider"></div>

                    <button class="md-tool-btn" data-action="link" title="リンク (Ctrl+K)" aria-label="リンク挿入">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                        </svg>
                    </button>
                    <button class="md-tool-btn" data-action="image" title="画像" aria-label="画像挿入">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <circle cx="8.5" cy="8.5" r="1.5"></circle>
                            <polyline points="21 15 16 10 5 21"></polyline>
                        </svg>
                    </button>

                    <div class="md-toolbar-divider"></div>

                    <button class="md-tool-btn" data-action="code-block" title="コードブロック" aria-label="コードブロック">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <polyline points="16 18 22 12 16 6"></polyline>
                            <polyline points="8 6 2 12 8 18"></polyline>
                        </svg>
                    </button>
                    <button class="md-tool-btn" data-action="inline-code" title="インラインコード" aria-label="インラインコード">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <polyline points="13 17 18 12 13 7"></polyline>
                            <polyline points="11 7 6 12 11 17"></polyline>
                        </svg>
                    </button>

                    <div class="md-toolbar-divider"></div>

                    <button class="md-tool-btn" data-action="ul" title="箇条書きリスト" aria-label="箇条書きリスト">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <line x1="8" y1="6" x2="21" y2="6"></line>
                            <line x1="8" y1="12" x2="21" y2="12"></line>
                            <line x1="8" y1="18" x2="21" y2="18"></line>
                            <line x1="3" y1="6" x2="3.01" y2="6"></line>
                            <line x1="3" y1="12" x2="3.01" y2="12"></line>
                            <line x1="3" y1="18" x2="3.01" y2="18"></line>
                        </svg>
                    </button>
                    <button class="md-tool-btn" data-action="ol" title="番号付きリスト" aria-label="番号付きリスト">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <line x1="10" y1="6" x2="21" y2="6"></line>
                            <line x1="10" y1="12" x2="21" y2="12"></line>
                            <line x1="10" y1="18" x2="21" y2="18"></line>
                            <path d="M4 6h1v4"></path>
                            <path d="M4 10h2"></path>
                            <path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"></path>
                        </svg>
                    </button>
                    <button class="md-tool-btn" data-action="quote" title="引用" aria-label="引用">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"></path>
                            <path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2h.75c0 2.25.25 4-2.75 4v3c0 1 0 1 1 1z"></path>
                        </svg>
                    </button>

                    <div class="md-toolbar-divider"></div>

                    <button class="md-tool-btn" data-action="hr" title="水平線" aria-label="水平線">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                        </svg>
                    </button>
                    <button class="md-tool-btn" data-action="table" title="テーブル" aria-label="テーブル挿入">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="3" y1="9" x2="21" y2="9"></line>
                            <line x1="3" y1="15" x2="21" y2="15"></line>
                            <line x1="12" y1="3" x2="12" y2="21"></line>
                        </svg>
                    </button>
                </div>

                <textarea id="input-text" aria-label="マークダウンテキスト入力エリア" placeholder="ここにテキストを入力してください...

例:
# 見出し1
## 見出し2
### 見出し3

**太字**
*斜体*

- リスト項目1
- リスト項目2

1. 番号付きリスト1
2. 番号付きリスト2

[リンク](https://example.com)

`コード`

```
コードブロック
```
"></textarea>
            </div>

            <div id="output-section" class="output-section" role="tabpanel" aria-labelledby="tab-preview">
                <div class="section-header">
                    <h2>プレビュー</h2>
                    <button id="copy-btn" class="copy-button" title="HTMLをコピー" aria-label="変換されたHTMLをクリップボードにコピー">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                        コピー
                    </button>
                </div>
                <div id="output-preview" class="preview-content" role="region" aria-label="マークダウンプレビュー" aria-live="polite">
                    <p class="placeholder">ここにマークダウンのプレビューが表示されます</p>
                </div>
            </div>
        </div>

        <div class="info-section">
            <h3>使い方</h3>
            <ul>
                <li>左側のテキストエリアにマークダウン記法でテキストを入力してください</li>
                <li>右側にリアルタイムでプレビューが表示されます</li>
                <li>「コピー」ボタンをクリックすると、変換されたHTMLをクリップボードにコピーできます</li>
            </ul>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
